name: Playwright Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: "staging"
        required: true
        default: "staging"
        type: choice
        options: [staging]


jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4  ## el repositorio hace checkout 

      - uses: actions/setup-node@v4  ## Instalamos node
        with: 
         node-version: lts/*
         cache: "npm"
      
      - name: Instalar dependencias
        run: npm ci
      
      - name: Instalar chromium
        run: npx playwright install chromium --with-deps 
      
      - name: Crear archivo .env desde secrets
        run: |
          echo "ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}" >> .env
          echo "STUDENT_PASSWORD=${{ secrets.STUDENT_PASSWORD }}" >> .env
      
      - name: Ejecutar tests en Playwright
        run: npm run test

      - name: Limpiar .env
        if: always()
        run: rm -f .env

      - name: Subir reporte HTML
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report 
          path: playwright-report
          retention-days: 30