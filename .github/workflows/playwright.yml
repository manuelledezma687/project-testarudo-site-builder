name: Playwright Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4  ## el repositorio hace checkout 

      - uses: actions/setup-node@v4  ## Instalamos node
        with: 
         node-version: lts/*
         cache: "npm"
      
      - name: Instalar dependencias
        run: npm ci
      
      - name: Instalar chromium
        run: npx playwright install chromium --with-deps 
      
      - name: Ejecutar tests en Playwright
        run: npm run test

      - name: Subir reporte HTML
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report 
          path: playwright-report
          retention-days: 30